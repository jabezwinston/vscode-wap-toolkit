name: Release VSIX

on:
  release:
    types: [published]
  # Manual runs build the VSIX and keep it as a workflow artifact (no release upload).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Check release tag matches package.json version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Release tag '$TAG' does not match package.json version '$VERSION'"
            exit 1
          fi

      - run: npm ci

      - name: Package VSIX
        id: package
        run: |
          VSIX="$(node -p "const p=require('./package.json'); p.name + '-' + p.version").vsix"
          npx --yes @vscode/vsce@4.1.0 package --out "$VSIX"
          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.vsix }}
          archive: false
          if-no-files-found: error

      - name: Attach VSIX to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.package.outputs.vsix }}" --clobber
